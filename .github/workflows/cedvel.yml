# Qaib Jurnalı — avtomatika.
# Saatda bir dəfə işləyir və iki iş görür:
#   1) buluddaki cədvəldən qaib-cedvel.ics faylını yenidən qurur
#      (telefon ona abunədir — dərsdən 5 dəqiqə əvvəlki bildirişlər oradan gəlir)
#   2) səhər saat 9-da günün dərs xülasəsini, imtahanlara 2 və 1 gün qalmış
#      xəbərdarlığı proqramın öz adı və ikonu ilə göndərir
name: Qaib avtomatikasi

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      sinaq:
        description: "Telefona derhal sinaq bildirisi gonder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: qaib-avto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxana
        run: pip install --quiet pywebpush

      - name: Lenti qur, bildirisleri gonder
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SINAQ: ${{ inputs.sinaq }}
          TZ: Asia/Baku
        run: |
          python - << 'QAIB_PY'
          # -*- coding: utf-8 -*-
          """Tetbiqdeki ile eyni mentiqle .ics qurur (tetbiqdeki buildIcs-in tam qarsiligi)."""
          import io, json, re, os, datetime, urllib.parse

          CRLF = "\r\n"
          DAYS = ["mon", "tue", "wed", "thu", "fri"]
          WEEK_AZ = {"ust": "Üst həftə", "alt": "Alt həftə"}


          def fold(line):
              b = line.encode("utf-8")
              if len(b) <= 73:
                  return line
              out, cur, n = [], "", 0
              for ch in line:
                  c = len(ch.encode("utf-8"))
                  if n + c > 73:
                      out.append(cur); cur = " "; n = 1
                  cur += ch; n += c
              out.append(cur)
              return CRLF.join(out)


          def esc(s):
              return (str(s).replace("\\", "\\\\").replace(";", "\\;")
                      .replace(",", "\\,").replace("\n", "\\n"))


          def stamp(d):
              return d.strftime("%Y%m%dT%H%M00")


          def stamp_utc(d):
              return d.utctimetuple() and datetime.datetime(*d.utctimetuple()[:6]).strftime("%Y%m%dT%H%M00Z")


          def parse_range(t):
              m = re.search(r"(\d{1,2})[:.](\d{2})(?:\s*[–\-—]\s*(\d{1,2})[:.](\d{2}))?", str(t or ""))
              if not m:
                  return None
              s = int(m.group(1)) * 60 + int(m.group(2))
              e = int(m.group(3)) * 60 + int(m.group(4)) if m.group(3) else s + 80
              if e <= s:
                  e = s + 80
              return s, e


          def monday_of(d):
              d = d.replace(hour=0, minute=0, second=0, microsecond=0)
              return d - datetime.timedelta(days=d.weekday())


          def current_week_type(anchor, now):
              base = monday_of(datetime.datetime.strptime(anchor["monday"], "%Y-%m-%d"))
              cur = monday_of(now)
              weeks = round((cur - base).days / 7.0)
              other = "alt" if anchor["type"] == "ust" else "ust"
              return anchor["type"] if weeks % 2 == 0 else other


          def build(state, weeks=16, minutes_before=5, stamp_str=None):
              now = datetime.datetime.now()
              utc = datetime.datetime.now(datetime.timezone.utc)
              L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Qaib Jurnali//AZ//",
                   "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
                   "X-WR-CALNAME:Qaib Jurnalı", "X-WR-TIMEZONE:Asia/Baku",
                   "REFRESH-INTERVAL;VALUE=DURATION:PT4H", "X-PUBLISHED-TTL:PT4H"]
              ds = stamp_str or utc.strftime("%Y%m%dT%H%M00Z")
              key = state["active"]
              sch = state["schedules"][key]
              cw = current_week_type(state.get("weekAnchor") or {"monday": "2026-09-28", "type": "ust"}, now)
              mon_this = monday_of(now)
              lessons = skipped = exams = 0

              for wk in ("alt", "ust"):
                  base = mon_this + datetime.timedelta(days=0 if wk == cw else 7)
                  for di, dk in enumerate(DAYS):
                      for e in sch.get(wk, {}).get(dk, []):
                          subj = (e.get("subject") or "").strip()
                          if not subj:
                              continue
                          tr = parse_range(e.get("time"))
                          if not tr:
                              skipped += 1
                              continue
                          start = (base + datetime.timedelta(days=di)).replace(
                              hour=tr[0] // 60, minute=tr[0] % 60)
                          end = start.replace(hour=tr[1] // 60, minute=tr[1] % 60)
                          until = start + datetime.timedelta(days=weeks * 7)
                          lessons += 1
                          L += ["BEGIN:VEVENT",
                                "UID:qaib-%s-%s-%d@qaib" % (wk, dk, lessons),
                                "DTSTAMP:" + ds,
                                "DTSTART:" + stamp(start),
                                "DTEND:" + stamp(end),
                                "RRULE:FREQ=WEEKLY;INTERVAL=2;UNTIL=" + stamp(until),
                                fold("SUMMARY:" + esc(subj))]
                          if e.get("room"):
                              L.append(fold("LOCATION:" + esc(e["room"])))
                          desc = " · ".join([x for x in [e.get("teacher"), WEEK_AZ[wk]] if x])
                          if desc:
                              L.append(fold("DESCRIPTION:" + esc(desc)))
                          L += ["BEGIN:VALARM", "TRIGGER:-PT%dM" % minutes_before, "ACTION:DISPLAY",
                                fold("DESCRIPTION:" + esc("%s — %d dəqiqə qaldı" % (subj, minutes_before))),
                                "END:VALARM", "END:VEVENT"]

              for skey in state.get("semesters", {}):
                  for r in state["semesters"][skey].get("courses", []):
                      iso = r.get("examDate")
                      if not iso:
                          continue
                      try:
                          st = datetime.datetime.strptime(iso[:16], "%Y-%m-%dT%H:%M")
                      except ValueError:
                          continue
                      if st < now:          # kecmis imtahanlar teqvime dusmesin
                          continue
                      exams += 1
                      L += ["BEGIN:VEVENT",
                            "UID:qaib-imtahan-%d@qaib" % exams,
                            "DTSTAMP:" + ds,
                            "DTSTART:" + stamp(st),
                            "DTEND:" + stamp(st + datetime.timedelta(hours=2)),
                            fold("SUMMARY:İmtahan — " + esc(r["name"]))]
                      if r.get("examRoom"):
                          L.append(fold("LOCATION:" + esc(r["examRoom"])))
                      L += ["BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY",
                            fold("DESCRIPTION:" + esc(r["name"] + " imtahanına 2 gün qaldı")), "END:VALARM",
                            "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY",
                            fold("DESCRIPTION:" + esc(r["name"] + " imtahanına 1 gün qaldı")), "END:VALARM",
                            "END:VEVENT"]

              L.append("END:VCALENDAR")
              return CRLF.join(L) + CRLF, lessons, exams, skipped


          def test_ics(minutes_ahead=15):
              now = datetime.datetime.now()
              utc = datetime.datetime.now(datetime.timezone.utc)
              start = now + datetime.timedelta(minutes=minutes_ahead)
              end = start + datetime.timedelta(minutes=10)
              L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Qaib Jurnali//AZ//",
                   "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Qaib Jurnalı",
                   "BEGIN:VEVENT",
                   "UID:qaib-sinaq-%d@qaib" % int(now.timestamp()),
                   "DTSTAMP:" + utc.strftime("%Y%m%dT%H%M00Z"),
                   "DTSTART:" + stamp(start),
                   "DTEND:" + stamp(end),
                   fold("SUMMARY:" + esc("Qaib Jurnalı — sınaq bildirişi")),
                   fold("DESCRIPTION:" + esc("Dərs bildirişlərini yoxlamaq üçündür. Silə bilərsən.")),
                   "BEGIN:VALARM", "TRIGGER:-PT10M", "ACTION:DISPLAY",
                   fold("DESCRIPTION:" + esc("Sınaq — 10 dəqiqə qaldı")), "END:VALARM",
                   "BEGIN:VALARM", "TRIGGER:-PT5M", "ACTION:DISPLAY",
                   fold("DESCRIPTION:" + esc("Sınaq — 5 dəqiqə qaldı")), "END:VALARM",
                   "END:VEVENT", "END:VCALENDAR"]
              return CRLF.join(L) + CRLF, start


          AY = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul",
                "avqust", "sentyabr", "oktyabr", "noyabr", "dekabr"]


          def api(base, key, path, method="GET", data=None):
              """Firebase RTDB REST. path: '' -> butov qovsaq, '/push' -> alt sahe."""
              import urllib.request
              u = (base + "/vaults/" + urllib.parse.quote(key, safe="") + path + ".json")
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(u, data=body, method=method,
                                           headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8")
              return json.loads(raw) if raw and raw != "null" else None


          def start_min(t):
              r = parse_range(t)
              return r[0] if r else 10 ** 6


          def hhmm(m):
              return "%02d:%02d" % (m // 60, m % 60)


          def today_lessons(state, now):
              """Bugunku derslerin siyahisi: [(dakika, ad, otaq)]"""
              di = now.weekday()
              if di > 4:
                  return []
              wk = current_week_type(state.get("weekAnchor") or
                                     {"monday": "2026-09-28", "type": "ust"}, now)
              sch = (state.get("schedules") or {}).get(state.get("active")) or {}
              out = []
              for e in (sch.get(wk) or {}).get(DAYS[di], []):
                  subj = (e.get("subject") or "").strip()
                  if not subj:
                      continue
                  out.append((start_min(e.get("time")), subj, (e.get("room") or "").strip()))
              out.sort()
              return out


          def upcoming_exams(state, now):
              """(gun_qalir, ad, tarix, otaq) - yalniz 1 ve 2 gun qalmislar."""
              bugun = now.date()
              out = []
              for skey in (state.get("semesters") or {}):
                  for r in (state["semesters"][skey].get("courses") or []):
                      iso = r.get("examDate")
                      if not iso:
                          continue
                      try:
                          st = datetime.datetime.strptime(iso[:16], "%Y-%m-%dT%H:%M")
                      except ValueError:
                          continue
                      qalan = (st.date() - bugun).days
                      if qalan in (1, 2):
                          out.append((qalan, r.get("name") or "?", st,
                                      (r.get("examRoom") or "").strip()))
              out.sort()
              return out


          def slug(ad):
              """Firebase acarinda nokte, #, $, [, ], / olmaz - qisa hash isledirik."""
              import hashlib
              return hashlib.sha1(ad.encode("utf-8")).hexdigest()[:10]


          def send_one(sub, payload, priv):
              from pywebpush import webpush, WebPushException
              try:
                  webpush(
                      subscription_info={"endpoint": sub["endpoint"],
                                         "keys": {"p256dh": sub["p256dh"], "auth": sub["auth"]}},
                      data=json.dumps(payload, ensure_ascii=False),
                      vapid_private_key=priv,
                      vapid_claims={"sub": "mailto:qaib@users.noreply.github.com"},
                      ttl=86400,
                  )
                  return 200
              except WebPushException as e:
                  code = getattr(getattr(e, "response", None), "status_code", 0)
                  print("   push xetasi:", code, str(e)[:120])
                  return code


          def do_sinaq(subs, now, priv):
              """Elle isə salinanda: saatdan ve nisandan asili olmayaraq bir bildiris."""
              ok = 0
              payload = {
                  "title": "Sınaq bildirişi",
                  "body": "Hər şey işləyir. Gündəlik cədvəl hər səhər saat 9-da bu cür gələcək.",
                  "tag": "qaib-sinaq-" + now.strftime("%H%M%S"),
              }
              for sid, sub in subs.items():
                  if not isinstance(sub, dict) or not sub.get("endpoint"):
                      continue
                  code = send_one(sub, payload, priv)
                  if code and code < 400:
                      ok += 1
                  print("   cihaz %s -> %s" % (sid, code))
              print("sinaq: %d cihaza gonderildi" % ok)
              return ok


          def do_push(base, key, node, state, now, priv):
              subs = node.get("push") or {}
              if not subs:
                  print("push: abune cihaz yoxdur - telefonda 'Proqram bildirislerini ac' basilmayib?")
                  return
              print("push: %d abune cihaz" % len(subs))

              if os.environ.get("SINAQ", "").strip().lower() == "true":
                  do_sinaq(subs, now, priv)
                  return

              if now.hour < 9:
                  print("push: saat 9-dan evveldir, gozleyir")
                  return

              gun = now.date().isoformat()
              sent = ((node.get("sent") or {}).get(gun)) or {}
              mesajlar = []

              if not sent.get("digest"):
                  ders = today_lessons(state, now)
                  if now.weekday() > 4:
                      pass                                  # hefte sonu - xulase yox
                  elif ders:
                      sat = " · ".join(
                          hhmm(m) + " " + ad + ((" (" + ot + ")") if ot else "")
                          for m, ad, ot in ders if m < 10 ** 6)
                      if not sat:
                          sat = " · ".join(ad for _, ad, _ in ders)
                      mesajlar.append(("digest", {
                          "title": "Bugünkü dərslər",
                          "body": sat, "tag": "qaib-gun-" + gun}))
                  else:
                      mesajlar.append(("digest", {
                          "title": "Bu gün dərs yoxdur",
                          "body": "Cədvəldə bu günə dərs yazılmayıb.",
                          "tag": "qaib-gun-" + gun}))

              for qalan, ad, st, otaq in upcoming_exams(state, now):
                  mk = "imtahan-%d-%s" % (qalan, slug(ad))
                  if sent.get(mk):
                      continue
                  tarix = "%d %s, %02d:%02d" % (st.day, AY[st.month - 1], st.hour, st.minute)
                  mesajlar.append((mk, {
                      "title": "İmtahan — %d gün qaldı" % qalan,
                      "body": ad + " · " + tarix + ((" · " + otaq) if otaq else ""),
                      "tag": "qaib-" + mk}))

              if not mesajlar:
                  print("push: gonderilecek yeni mesaj yoxdur")
                  return

              olu = []
              for mk, payload in mesajlar:
                  ok = 0
                  for sid, sub in subs.items():
                      if not isinstance(sub, dict) or not sub.get("endpoint"):
                          continue
                      code = send_one(sub, payload, priv)
                      if code in (404, 410):
                          olu.append(sid)
                      elif code and code < 400:
                          ok += 1
                  print("push: %-22s -> %d cihaz" % (mk, ok))
                  api(base, key, "/sent/" + gun, "PATCH", {mk: True})

              for sid in set(olu):
                  api(base, key, "/push/" + sid, "DELETE")
                  print("push: kohnelmis cihaz silindi:", sid)

              # kohne nisanlari temizle (7 gunden evvel)
              eski = [d for d in (node.get("sent") or {})
                      if d < (now.date() - datetime.timedelta(days=7)).isoformat()]
              for d in eski:
                  api(base, key, "/sent/" + d, "DELETE")


          if __name__ == "__main__":
              import sys
              try:
                  sys.stdout.reconfigure(encoding="utf-8")
              except Exception:
                  pass

              base = os.environ.get("FIREBASE_URL", "").strip().rstrip("/")
              key = os.environ.get("VAULT_KEY", "").strip()
              priv = os.environ.get("VAPID_PRIVATE", "").strip()
              if not base or not key:
                  sys.exit("XETA: FIREBASE_URL ve ya VAULT_KEY bos. Secrets-i yoxla.")

              node = api(base, key, "")
              if not node:
                  sys.exit("XETA: bulud bosdur. Proqramda 'Buluda gonder' bas.")
              if isinstance(node.get("stateJson"), str):
                  state = json.loads(node["stateJson"])
              else:
                  state = node.get("state")
              if not state:
                  sys.exit("XETA: melumat tapilmadi.")

              now = datetime.datetime.now()

              # 1) teqvim lenti
              ms = node.get("updatedAt") or 0
              stamp_str = None
              if ms:
                  d = datetime.datetime.fromtimestamp(ms / 1000.0, datetime.timezone.utc)
                  stamp_str = d.strftime("%Y%m%dT%H%M00Z")
              text, lessons, exams, skipped = build(state, 16, 5, stamp_str)
              io.open("qaib-cedvel.ics", "w", encoding="utf-8", newline="").write(text)
              print("ics: %d ders, %d imtahan, %d saatsiz atildi" % (lessons, exams, skipped))

              # 2) proqram bildirisleri
              if not priv:
                  print("push: VAPID_PRIVATE yoxdur, bu hisse atlanir")
              else:
                  try:
                      do_push(base, key, node, state, now, priv)
                  except Exception as e:
                      print("push: ugursuz -", str(e)[:160])
          QAIB_PY

      - name: Deyisiklik varsa yaz
        run: |
          if git diff --quiet -- qaib-cedvel.ics; then
            echo "lentde deyisiklik yoxdur"
            exit 0
          fi
          git config user.name "qaib-bot"
          git config user.email "qaib-bot@users.noreply.github.com"
          git add qaib-cedvel.ics
          git commit -m "teqvim lenti yenilendi"
          git push
