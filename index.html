/* ============================================================
   15. Hadisələr
   ============================================================ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-absent],[data-vweek],[data-flipweek],[data-copyweek],[data-add],[data-edit],[data-pick],[data-prof],[data-setsem],[data-export],[data-import],[data-reset],[data-dlg],[data-save],[data-discard],[data-synccfg],[data-syncnow],[data-syncpush],[data-ics],[data-addcourse],[data-course],[data-addsem],[data-report],[data-reportfile],[data-print],[data-setguard],[data-delguard],[data-update],[data-checkupd],[data-theme],[data-testics],[data-calhook],[data-caldiag],[data-pushon],[data-pushoff],[data-pushtest],[data-font],[data-fs],[data-more],[data-calunhook],[data-lockset],[data-lockbio],[data-locknow],[data-lockoff],[data-lockafter]");
  // <html> özü də data-theme/data-font daşıyır — boş yerə toxunuş onu "düymə" saymasın
  if (!t || t === document.documentElement) return;
  const host = document.getElementById("modal");

  if (t.dataset.dlg) {
    if (t.dataset.dlg === "delete" && host._onDelete) host._onDelete();
    else if (t.dataset.dlg === "save" && host._onSave) {
      const vals = {};
      host.querySelectorAll("[data-fld]").forEach((el) => { vals[el.dataset.fld] = el.value; });
      host._onSave(vals);
    }
    return closeDialog();
  }

  if (t.dataset.save != null) return commit();
  if (t.dataset.discard != null) return discard();
  if (t.dataset.more) return openMenu();
  if (t.dataset.go) {
    if (!host.hidden) closeDialog();
    return go(t.dataset.go);
  }

  if (t.dataset.absent != null) {
    const i = +t.dataset.absent, d = +t.dataset.delta;
    const r0 = activeSem().courses[i];
    if (!r0) return;
    const before = numOr(r0.absent);
    const after = Math.max(0, before + d);
    if (after === before) return;
    // ardıcıl toxunuşlarda "Geri al" ilk dəyərə qaytarır
    if (!(undoAbs && undoAbs.i === i && undoAbs.sem === state.active && toastOpen())) {
      undoAbs = { i, sem: state.active, prev: before };
    }
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (x) { /* dəstəklənmir */ } }
    mutate((s) => { s.semesters[s.active].courses[i].absent = after; });
    const m = compute(r0);
    const u = undoAbs;
    const warn = d > 0 ? qaibWarn(after, m.G) : "";
    const nm = r0.name.length > 26 ? r0.name.slice(0, 25) + "…" : r0.name;
    if (warn && navigator.vibrate) { try { navigator.vibrate([30, 60, 30]); } catch (x) {} }
    toast(`${nm} · ${after}${m.G != null ? " / " + m.G : ""} saat${warn ? "\n" + warn : ""}`, "Geri al", () => {
      const sm = state.semesters[u.sem];
      if (sm && sm.courses[u.i]) mutate((s) => { s.semesters[u.sem].courses[u.i].absent = u.prev; });
      undoAbs = null;
    });
    return;
  }

  if (t.dataset.vweek) { viewWeek = t.dataset.vweek; return render(); }

  if (t.dataset.flipweek) {
    viewWeek = null;
    return mutate((s) => { s.weekAnchor.type = s.weekAnchor.type === "ust" ? "alt" : "ust"; });
  }

  if (t.dataset.copyweek) {
    const to = shownWeek();
    const from = to === "alt" ? "ust" : "alt";
    return mutate((s) => { s.schedules[s.active][to] = structuredClone(s.schedules[s.active][from]); });
  }

  if (t.dataset.add) {
    const parts = t.dataset.add.split(":");
    const wk = parts[0], dk = parts[1];
    const label = DAYS.find(([k]) => k === dk)[1];
    return openDialog(`${label} — yeni dərs`, weekName(wk),
      lessonFields({ time: "", subject: "", room: "", teacher: "" }),
      (v) => {
        if (!String(v.subject || "").trim()) return;
        mutate((s) => {
          s.schedules[s.active][wk][dk].push({
            time: String(v.time || "").trim(),
            subject: v.subject,
            room: String(v.room || "").trim(),
            teacher: String(v.teacher || "").trim() || cat(v.subject).teacher || "",
          });
        });
      }, "Əlavə et");
  }

  if (t.dataset.edit) {
    const parts = t.dataset.edit.split(":");
    const wk = parts[0], dk = parts[1], i = +parts[2];
    const e0 = weekBlock(wk)[dk][i];
    const label = DAYS.find(([k]) => k === dk)[1];
    return openDialog(`${label} — dərsi dəyiş`, weekName(wk), lessonFields(e0),
      (v) => mutate((s) => {
        const cell = s.schedules[s.active][wk][dk][i];
        cell.time = String(v.time || "").trim();
        cell.subject = v.subject || "";
        cell.room = String(v.room || "").trim();
        cell.teacher = String(v.teacher || "").trim() || (v.subject ? cat(v.subject).teacher : "") || "";
      }),
      "Yadda saxla",
      () => mutate((s) => { s.schedules[s.active][wk][dk].splice(i, 1); }));
  }

  /* ---- fənn əlavə et ---- */
  if (t.dataset.addcourse) {
    const have = activeSem().courses.map((c) => c.name);
    const free = CATALOG.filter((c) => have.indexOf(c.name) < 0);
    return openDialog("Fənn əlavə et", state.active,
      `<div class="fld"><label>Kataloqdan seç</label><select data-fld="name">
         <option value="">— seç —</option>
         ${free.map((c) => `<option value="${esc(c.name)}">${esc(c.name)} · ${c.credits} kredit</option>`).join("")}
       </select></div>
       <div class="fld txt" style="margin-top:10px"><label>və ya adı özün yaz</label>
         <input data-fld="custom" placeholder="kataloqda olmayan fənn"></div>`,
      (val) => {
        const name = String(val.custom || "").trim() || String(val.name || "").trim();
        if (!name) return;
        mutate((s) => {
          const list = s.semesters[s.active].courses;
          if (list.some((c) => c.name === name)) return;
          list.push(row(name, 0));
        });
      }, "Əlavə et");
  }

  /* ---- fənnə toxunanda: dəqiq qaib / sil ---- */
  if (t.dataset.course != null) {
    const i = +t.dataset.course;
    const r = activeSem().courses[i];
    const m = compute(r);
    return openDialog(r.name, m.G == null ? "limit təyin olunmayıb" : "limit " + m.G + " saat",
      `<div class="fld"><label>İşlənmiş qaib (saat)</label>
         <input class="mono" inputmode="numeric" data-fld="v" value="${m.F}"></div>
       <p class="dlg-msg" style="margin-top:11px">Fənni silsən, onun qaibi və qiymətləri də silinir.</p>`,
      (val) => mutate((s) => { s.semesters[s.active].courses[i].absent = Math.max(0, numOr(val.v)); }),
      "Yadda saxla",
      () => mutate((s) => {
        s.semesters[s.active].courses.splice(i, 1);
        selected = 0;
      }));
  }

  /* ---- semestr əlavə et ---- */
  if (t.dataset.addsem) {
    const keys = Object.keys(state.semesters);
    return openDialog("Yeni semestr", keys.length + " semestr var",
      `<div class="fld txt"><label>Semestrin adı</label>
         <input data-fld="name" placeholder="Kurs 2 • Semestr 2"></div>
       <div class="fld" style="margin-top:10px"><label>Fənnləri haradan götürsün</label>
         <select data-fld="from">
           <option value="">boş başla</option>
           ${keys.map((k) => `<option value="${esc(k)}">${esc(k)} — fənn adlarını köçür</option>`).join("")}
         </select></div>
       <p class="dlg-msg" style="margin-top:11px">Köçürəndə yalnız fənn adları gəlir; qaib və qiymətlər sıfırdan başlayır.</p>`,
      (val) => {
        const name = String(val.name || "").trim();
        if (!name || state.semesters[name]) return;
        const from = String(val.from || "");
        mutate((s) => {
          const src = s.semesters[from];
          s.semesters[name] = {
            courses: src ? src.courses.map((c) => row(c.name, 0)) : [],
          };
          s.schedules[name] = { alt: emptyWeek(), ust: emptyWeek() };
          s.active = name;
          resetSelection();
        });
      }, "Yarat");
  }

  /* ---- hesabat ---- */
  if (t.dataset.report) { reportSem = t.dataset.report; current = "report"; render(); return; }
  if (t.dataset.print) { window.print(); return; }
  if (t.dataset.reportfile) {
    const key = t.dataset.reportfile;
    saveFile("hesabat-" + key.replace(/[^\w\u0400-\u04ff-]+/g, "-") + ".html", reportFile(key), "text/html;charset=utf-8");
    return;
  }

  if (t.dataset.pick != null) { selected = +t.dataset.pick; return render(); }

  if (t.dataset.setsem) {
    const k = t.dataset.setsem;
    resetSelection();
    return mutate((s) => { s.active = k; });
  }

  if (t.dataset.prof) {
    const key = t.dataset.prof;
    return openDialog(key, "Profil",
      `<div class="fld txt"><label>${esc(key)}</label><input data-fld="v" value="${esc(state.profile[key] || "")}"></div>`,
      (v) => mutate((s) => { s.profile[key] = v.v; }));
  }

  if (t.dataset.synccfg) {
    const c = cloudCfg() || { url: "", key: "" };
    return openDialog("Sinxron ayarı", "Firebase Realtime Database",
      `<div class="fld txt" style="margin-bottom:10px"><label>Baza ünvanı — Database URL</label>
         <input data-fld="url" value="${esc(c.url)}" placeholder="https://qaib-xxxx-default-rtdb.firebaseio.com"></div>
       <div class="fld txt"><label>Açar</label>
         <input data-fld="key" value="${esc(c.key)}" placeholder="açarı yerləşdir"></div>
       <p class="dlg-msg" style="margin-top:12px">Hər iki cihazda <b>eyni</b> ünvan və <b>eyni</b> açar yazılmalıdır.
         Bu iki dəyər yalnız bu cihazda saxlanılır, açıq səhifədə görünmür.</p>`,
      (val) => {
        const cfg = { url: String(val.url || "").trim(), key: String(val.key || "").trim() };
        if (!cfg.url || !cfg.key) return;
        cloudCfgSave(cfg);
        backend = makeCloudBackend(cfg);
        setSync("busy", "Yoxlanılır");
        backend.pull()
          .then((payload) => {
            if (!payloadState(payload)) {
              commit();          // bulud boşdur: bu cihazdaki məlumatı ilk nüsxə kimi göndər
            } else {
              onRemote(payload);
              render();
            }
          })
          .catch((err) => { setSync("local", "Alınmadı — " + ((err && err.message) || "xəta")); render(); });
      }, "Yoxla və saxla");
  }

  if (t.dataset.syncnow) { cloudRefresh(); return; }

  /* buluda məcburi göndəriş — saxlanılmamış dəyişiklik olmasa da işləyir */
  if (t.dataset.syncpush) { commit(); return; }

  if (t.dataset.ics) {
    const out = buildIcs(16, 5);
    return openDialog("Təqvim faylı", out.lessons + " dərs · " + out.exams + " imtahan",
      `<p class="dlg-msg">Fayl 16 həftəlik dərsləri (alt/üst həftə üçün 2 həftədən bir təkrar) və
         yazılmış imtahanları əhatə edir.${out.skipped
           ? ` <b>${out.skipped} dərsin saatı yazılmayıb</b> — onlar faylda yoxdur.` : ""}</p>
       <p class="dlg-msg" style="margin-top:11px">${isStandalone()
         ? "<b>Paylaş</b> düyməsinə bas → siyahıdan <b>Təqvim</b>-i seç → <b>Əlavə et</b>."
         : "Endirdikdən sonra fayla toxun → <b>Təqvimə əlavə et</b>."}
         Dərs cədvəlini dəyişəndə faylı yenidən yarat.</p>`,
      () => { saveFile("qaib-cedvel.ics", out.text, "text/calendar;charset=utf-8"); },
      isStandalone() ? "Paylaş" : "Faylı endir");
  }

  if (t.dataset.export) {
    return openDialog("Məlumatın çıxarışı", "JSON",
      `<p class="dlg-msg" style="margin-bottom:10px">Hamısını seç və kopyala, sonra digər cihazda <b>Məlumatı yüklə</b> ilə yerləşdir.</p>
       <textarea class="ta" id="expta" readonly>${esc(JSON.stringify(state))}</textarea>`,
      () => {
        const ta = document.getElementById("expta");
        if (ta) { ta.select(); try { document.execCommand("copy"); } catch (err) {} }
      }, "Kopyala");
  }

  if (t.dataset.import) {
    return openDialog("Məlumatı yüklə", "JSON",
      `<p class="dlg-msg" style="margin-bottom:10px">Digər cihazdan kopyaladığın mətni bura yerləşdir. Hazırkı məlumat üzərinə yazılacaq — sonra <b>Saxla</b> düyməsini bas.</p>
       <textarea class="ta" data-fld="json" placeholder="{ ... }"></textarea>`
       + (guardOn() ? `<div class="fld" style="margin-top:12px"><label>Qoruma kodu</label>
            <input type="password" inputmode="numeric" data-fld="code" autocomplete="off"></div>` : ""),
      (v) => {
        if (guardOn() && !guardOk(v.code)) { badCode(); return; }
        let parsed = null;
        try { parsed = JSON.parse(v.json); } catch (err) { parsed = null; }
        if (!parsed || !parsed.semesters) {
          setTimeout(() => openDialog("Mətn oxunmadı", "",
            `<p class="dlg-msg">Yerləşdirilən mətn tam JSON deyil. Çıxarışı əvvəldən sonadək, heç nə kəsmədən kopyala.</p>`,
            null, "Oldu"), 0);
          return;
        }
        resetSelection();
        mutate((s) => { Object.assign(s, migrate(parsed)); });
      }, "Yüklə");
  }

  /* ---- proqram bildirişləri ---- */
  if (t.dataset.pushon) {
    return openDialog("Bildirişləri aç", "bir dəfəlik icazə",
      `<p class="dlg-msg">Təsdiqləyəndə telefon <b>«Bildirişlərə icazə verilsin?»</b> soruşacaq —
         <b>İcazə ver</b>-i seç.</p>
       <p class="dlg-msg" style="margin-top:11px">Bundan sonra hər dərsdən 5 dəqiqə əvvəl, səhər günün
         siyahısı və imtahanlardan əvvəl xəbərdarlıq <b>Qaib Jurnalı</b> adı ilə gələcək.</p>
       ${isiOS() && !isStandalone() ? `<p class="dlg-msg" style="margin-top:11px"><b>Qeyd:</b>
         iPhone-da bu yalnız əsas ekrana əlavə edilmiş proqramda işləyir. Safari-dən açmısansa,
         əvvəlcə əsas ekrandaki ikondan aç.</p>` : ""}`,
      () => {
        pushEnable().then(() => {
          render();
          setTimeout(() => openDialog("Açıldı", "",
            `<p class="dlg-msg">Bildirişlər qoşuldu.
               <b>Necə görünür?</b> düyməsi ilə nümunəsini indi görə bilərsən.</p>`,
            null, "Oldu"), 0);
        }).catch((err) => {
          pushRefresh().then(render);
          setTimeout(() => openDialog("Alınmadı", "",
            `<p class="dlg-msg">${esc(err.message || String(err))}</p>`, null, "Bağla"), 0);
        });
      }, "İcazə ver");
  }
  if (t.dataset.pushoff) {
    return openDialog("Söndürülsün?", "",
      `<p class="dlg-msg">Dərs xatırlatmaları, günün siyahısı və imtahan xəbərdarlıqları bu cihaza gəlməyəcək.</p>`,
      () => { pushDisable().then(render); }, "Söndür");
  }
  if (t.dataset.pushtest) {
    pushTestLocal().catch((err) => openDialog("Alınmadı", "",
      `<p class="dlg-msg">${esc(err.message || String(err))}</p>`, null, "Bağla"));
    return;
  }

  /* ---- təqvimi qoş ---- */
  if (t.dataset.calhook) {
    if (!CAL_FEED) {
      return openDialog("Əlçatan deyil", "yalnız onlayn nüsxədə",
        `<p class="dlg-msg">Bu düymə saytdan açılan nüsxədə işləyir
           (<b>${esc(CAL_HOST)}</b>). Kompüterdəki fayl nüsxəsində
           <b>Fayl kimi endir</b> yolundan istifadə et.</p>`, null, "Bağla");
    }
    return openDialog("Bildirişləri qoş", isiOS() ? "iPhone" : "bu cihaz",
      `<p class="dlg-msg">Aşağıdakı düymə telefonun <b>Təqvim</b> tətbiqini açacaq və
         <b>Abunə ol</b> soruşacaq. Təsdiqlə — vəssalam.</p>
       <p class="dlg-msg" style="margin-top:11px">Bundan sonra cədvəli burada dəyişsən,
         təqvim özü yenilənir. Bir daha fayl endirmək lazım olmayacaq.</p>
       <p class="dlg-msg" style="margin-top:11px"><b>Diqqət:</b> açılan pəncərədə
         <b>«Xəbərdarlıqları sil»</b> sönülü qalsın — yoxsa bildirişlər gəlməz.</p>
       <div class="row" style="margin-top:13px">
         <a class="btn primary" href="${esc(CAL_FEED)}">Təqvimi aç və abunə ol</a>
       </div>
       <p class="dlg-msg" style="margin-top:11px;opacity:.75">Alınmasa, Safari-də bu ünvanı
         əlinlə aç: <b>${esc(CAL_HOST + "/" + CAL_FILE)}</b></p>`,
      () => { mutate((s) => { s.calHooked = true; }); }, "Qoşuldu");
  }

  if (t.dataset.calunhook) {
    return mutate((s) => { s.calHooked = false; });
  }

  /* ---- bildiriş gəlmirsə ---- */
  if (t.dataset.caldiag) {
    return openDialog("Bildiriş gəlmirsə", "üç yeri yoxla",
      `<p class="dlg-msg"><b>1.</b> Təqvimdə hər hansı dərsə toxun →
         <b>Xəbərdarlıq</b> sətrində «5 dəqiqə əvvəl» yazmalıdır.
         «Yoxdur» yazırsa: <b>Parametrlər → Təqvim → Hesablar →
         Abunə olunmuş təqvimlər</b> → «Xəbərdarlıqları sil» <b>sönülü</b> olsun.</p>
       <p class="dlg-msg" style="margin-top:11px"><b>2.</b> <b>Parametrlər → Bildirişlər →
         Təqvim</b> → «Bildirişlərə icazə ver» açıq, <b>«Planlı yekun»</b> isə sönülü olsun
         (yekun açıq olsa bildiriş gec gəlir).</p>
       <p class="dlg-msg" style="margin-top:11px"><b>3.</b> Dərs saatı <b>Yuxu</b> ya
         <b>Narahat etmə</b> rejiminə düşürsə, bildiriş səssiz gəlir.
         <b>Parametrlər → Fokus</b>-da Təqvimə icazə ver.</p>`,
      null, "Bağla");
  }

  /* ---- yazı növü və ölçüsü ---- */
  if (t.dataset.font) {
    const f = t.dataset.font;
    return mutate((s) => { s.font = f; });
  }
  if (t.dataset.fs) {
    const z = t.dataset.fs;
    return mutate((s) => { s.fontSize = z; });
  }

  /* ---- görünüş ---- */
  if (t.dataset.theme) {
    const th = t.dataset.theme;
    return mutate((s) => { s.theme = th; });
  }

  /* ---- sınaq bildirişi ---- */
  if (t.dataset.testics) {
    const hhmm = (d) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const start = new Date(Date.now() + 10 * 60000);
    const a1 = new Date(start.getTime() - 5 * 60000);
    const a2 = new Date(start.getTime() - 2 * 60000);
    return openDialog("Sınaq bildirişi", hhmm(start) + "-də başlayır",
      `<p class="dlg-msg">Təqvimə <b>${hhmm(start)}</b>-də başlayan sınaq hadisəsi əlavə edir.
         İki xəbərdarlıq qurulur:</p>
       <p class="dlg-msg" style="margin-top:9px">
         • <b>${hhmm(a1)}</b> — 5 dəqiqə qalmış <i>(dərs xəbərdarlığı ilə eyni)</i><br>
         • <b>${hhmm(a2)}</b> — 2 dəqiqə qalmış</p>
       <p class="dlg-msg" style="margin-top:11px">${isStandalone()
         ? "<b>Paylaş</b> düyməsinə bas → açılan siyahıdan <b>Təqvim</b>-i seç → <b>Əlavə et</b>."
         : "Faylı endir → üstünə toxun → <b>Təqvimə əlavə et</b>."}
         Sonra Təqvim tətbiqini açıb hadisənin yerində olduğunu yoxla.</p>`,
      () => { saveFile("qaib-sinaq.ics", testIcs(start), "text/calendar;charset=utf-8"); },
      isStandalone() ? "Paylaş" : "Faylı endir");
  }

  /* ---- versiya ---- */
  if (t.dataset.update) { applyUpdate(); return; }
  if (t.dataset.checkupd) {
    checkUpdate(true).then((varmi) => {
      render();
      if (!varmi) {
        openDialog("Ən son versiyadır", APP_BUILD,
          `<p class="dlg-msg">Yeni nüsxə yoxdur. Buna baxmayaraq köhnə göründüyünü düşünürsənsə,
             <b>Yenilə</b> ilə yaddaşı təmizləyə bilərsən.</p>
           <div class="row" style="margin-top:12px"><button class="btn" type="button" data-update="1">Yaddaşı təmizlə və yenilə</button></div>`,
          null, "Bağla");
      }
    });
    return;
  }

  /* ---- giriş kilidi ---- */
  if (t.dataset.lockset) {
    if (!lockOn()) return lockSetFlow(null);
    return lockAsk("Hazırkı kodu daxil et", () => lockSetFlow(lockCfg()));
  }
  if (t.dataset.lockbio === "on") return lockBioOn();
  if (t.dataset.lockbio === "off") {
    return lockAsk("Hazırkı kodu daxil et", () => {
      lockSave(Object.assign({}, lockCfg(), { bio: null }));
      toast(bioName() + " ayrıldı");
      render();
    });
  }
  if (t.dataset.locknow) return lockNow(false);
  if (t.dataset.lockoff) {
    return lockAsk("Kilidi söndürmək üçün kod", () => {
      lockSave(null);
      toast("Kilid söndürüldü");
      render();
    });
  }
  if (t.dataset.lockafter != null) {
    lockSave(Object.assign({}, lockCfg(), { after: +t.dataset.lockafter }));
    return render();
  }

  /* ---- kodu təyin et / dəyiş ---- */
  if (t.dataset.setguard) {
    return openDialog(guardOn() ? "Kodu dəyiş" : "Kod təyin et", "rəqəm və ya mətn",
      (guardOn() ? `<div class="fld" style="margin-bottom:10px"><label>Hazırkı kod</label>
           <input type="password" inputmode="numeric" data-fld="old" autocomplete="off"></div>` : "")
      + `<div class="fld"><label>Yeni kod</label>
           <input type="password" inputmode="numeric" data-fld="yeni" autocomplete="off"></div>
         <p class="dlg-msg" style="margin-top:11px">Kod bütün cihazlarında eyni olacaq.
           Unutsan, sıfırlamaq üçün mənə yaz.</p>`,
      (val) => {
        if (guardOn() && !guardOk(val.old)) { badCode(); return; }
        const yeni = String(val.yeni || "").trim();
        if (!yeni) return;
        mutate((s) => { s.guard = { hash: guardFingerprint(yeni) }; });
      }, "Təsdiqlə");
  }

  if (t.dataset.delguard) {
    return openDialog("Kodu sil", "qoruma söndürüləcək",
      `<div class="fld"><label>Hazırkı kod</label>
         <input type="password" inputmode="numeric" data-fld="old" autocomplete="off"></div>`,
      (val) => {
        if (!guardOk(val.old)) { badCode(); return; }
        mutate((s) => { delete s.guard; });
      }, "Sil");
  }

  if (t.dataset.reset) {
    return openDialog("İlkin vəziyyətə qaytarılsın?", "sonra Saxla lazımdır",
      `<p class="dlg-msg">Bütün qaib, qiymət və cədvəl dəyişiklikləri silinəcək və fayl ilk oxunduğu vəziyyətə qayıdacaq.</p>`
      + (guardOn() ? `<div class="fld" style="margin-top:12px"><label>Qoruma kodu</label>
           <input type="password" inputmode="numeric" data-fld="code" autocomplete="off"></div>` : ""),
      (val) => {
        if (guardOn() && !guardOk(val.code)) { badCode(); return; }
        resetSelection();
        mutate((s) => {
          const guard = s.guard;
          Object.assign(s, structuredClone(BASELINE));
          if (guard) s.guard = guard;      // kod sıfırlamadan sonra da qalır
        });
      },
      "Bəli, qaytar");
  }
});

document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeDialog();
});

document.getElementById("semPick").addEventListener("change", (e) => {
  resetSelection();
  mutate((s) => { s.active = e.target.value; });
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "find") { findQuery = el.value; return render(); }
  if (!el.dataset || el.dataset.g == null) return;
  const i = +el.dataset.g, field = el.dataset.field;

  /* tarix/saat iki ayrı sahədir — hər ikisi tam yazılana qədər render
     etmirik, yoxsa yarımçıq mətn hər hərfdə öz-özünə silinər */
  if (field === "examDateD" || field === "examDateT") {
    const g = el.dataset.g;
    const dEl = document.querySelector(`[data-g="${g}"][data-field="examDateD"]`);
    const tEl = document.querySelector(`[data-g="${g}"][data-field="examDateT"]`);
    if (!dEl || !tEl) return;
    const dRaw = dEl.value.trim(), tRaw = tEl.value.trim();
    if (!dRaw && !tRaw) { mutate((s) => { s.semesters[s.active].courses[i].examDate = ""; }); return; }
    const iso = dmyToIso(dRaw, tRaw);
    if (iso) mutate((s) => { s.semesters[s.active].courses[i].examDate = iso; });
    return;
  }

  const raw = el.value.trim();
  const asNum = raw === "" ? null : Number(raw.replace(",", "."));
  mutate((s) => {
    const r = s.semesters[s.active].courses[i];
    if (field === "sem") r.sem[+el.dataset.k] = Number.isNaN(asNum) ? null : asNum;
    else if (field === "examRoom") r[field] = raw;
    else r[field] = Number.isNaN(asNum) ? null : asNum;
  });
});

document.addEventListener("keydown", (e) => {
  const modal = document.getElementById("modal");
  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault();
    if (dirty) commit();
    return;
  }
  if (e.key === "Escape" && !modal.hidden) return closeDialog();
  if (!modal.hidden) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.key === "/") { e.preventDefault(); go("fenn"); const f = document.getElementById("find"); if (f) f.focus(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= VIEWS.length) { e.preventDefault(); go(VIEWS[n - 1][0]); }
});

/* ============================================================
   17. Təqvim ixracı (.ics) — iPhone bildirişləri bunun üzərindən gəlir
   ============================================================ */
const ICS_EOL = String.fromCharCode(13, 10);   // CRLF
const pad2 = (n) => String(n).padStart(2, "0");
const icsStamp = (d) =>
  d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
  "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
/* DTSTAMP UTC olmalıdır — əvvəl yerli saata "Z" əlavə olunurdu, bu səhv idi */
const icsStampUTC = (d) =>
  d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
  "T" + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + "00Z";

/* "09:00 – 10:20" → {s:540, e:620};  tək saat yazılıbsa 80 dəqiqə sayılır */
function parseRange(t) {
  const m = String(t || "").match(/(\d{1,2})[:.](\d{2})(?:\s*[–\-—]\s*(\d{1,2})[:.](\d{2}))?/);
  if (!m) return null;
  const s = Number(m[1]) * 60 + Number(m[2]);
  let e = m[3] != null ? Number(m[3]) * 60 + Number(m[4]) : s + 80;
  if (e <= s) e = s + 80;
  return { s, e };
}
const icsEsc = (s) => String(s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
/* RFC 5545 sətir qatlanması — bayt əsaslı, çoxbaytlı hərfi ortadan kəsmir */
function icsFold(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 73) return line;
  const out = [];
  let cur = "", bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > 73) { out.push(cur); cur = " "; bytes = 1; }
    cur += ch;
    bytes += b;
  }
  out.push(cur);
  return out.join(ICS_EOL);
}

/* Bu günün dərsləri bir sətirdə — sınaq bildirişi üçün */
function todayLessonLine() {
  try {
    const d = new Date();
    const dk = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][d.getDay()];
    if (dk === "sun" || dk === "sat") return "";
    const wk = currentWeekType();
    const sch = (state.schedules || {})[state.active] || {};
    const list = ((sch[wk] || {})[dk] || []).filter((x) => (x.subject || "").trim());
    if (!list.length) return "";
    return list.map((x) => ((x.time || "").split(/[–\-—]/)[0].trim() + " " + x.subject).trim())
      .join(" · ");
  } catch (e) { return ""; }
}

function buildIcs(weeks, minutesBefore) {
  weeks = weeks || 16;
  const mb = minutesBefore == null ? 5 : minutesBefore;
  const L = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Qaib Jurnali//AZ//",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "X-WR-CALNAME:Qaib Jurnalı", "X-WR-TIMEZONE:Asia/Baku",
    "REFRESH-INTERVAL;VALUE=DURATION:PT4H", "X-PUBLISHED-TTL:PT4H",
  ];
  const now = new Date();
  const stamp = icsStampUTC(now);
  const monThis = mondayOf(now);
  const cw = currentWeekType();
  let lessons = 0, exams = 0, skipped = 0;

  for (const wk of ["alt", "ust"]) {
    const base = new Date(monThis);
    if (wk !== cw) base.setDate(base.getDate() + 7);   // növbəti həftə o tipdədir
    DAYS.forEach(([dk], di) => {
      for (const e of weekBlock(wk)[dk]) {
        if (!e.subject) continue;
        const tr = parseRange(e.time);
        if (!tr) { skipped++; continue; }
        const start = new Date(base);
        start.setDate(start.getDate() + di);
        start.setHours(Math.floor(tr.s / 60), tr.s % 60, 0, 0);
        const end = new Date(start);
        end.setHours(Math.floor(tr.e / 60), tr.e % 60, 0, 0);
        const until = new Date(start);
        until.setDate(until.getDate() + weeks * 7);
        lessons++;
        L.push("BEGIN:VEVENT");
        L.push("UID:qaib-" + wk + "-" + dk + "-" + lessons + "-" + start.getTime() + "@qaib");
        L.push("DTSTAMP:" + stamp);
        L.push("DTSTART:" + icsStamp(start));
        L.push("DTEND:" + icsStamp(end));
        L.push("RRULE:FREQ=WEEKLY;INTERVAL=2;UNTIL=" + icsStamp(until));
        L.push(icsFold("SUMMARY:" + icsEsc(e.subject)));
        if (e.room) L.push(icsFold("LOCATION:" + icsEsc(e.room)));
        const desc = [e.teacher, weekName(wk)].filter(Boolean).join(" · ");
        if (desc) L.push(icsFold("DESCRIPTION:" + icsEsc(desc)));
        L.push("BEGIN:VALARM", "TRIGGER:-PT" + mb + "M", "ACTION:DISPLAY",
               icsFold("DESCRIPTION:" + icsEsc(e.subject + " — " + mb + " dəqiqə qaldı")), "END:VALARM");
        L.push("END:VEVENT");
      }
    });
  }

  for (const key of Object.keys(state.semesters)) {
    for (const r of state.semesters[key].courses) {
      if (!r.examDate) continue;
      const st = new Date(r.examDate);
      if (Number.isNaN(st.getTime())) continue;
      const en = new Date(st.getTime() + 2 * 3600000);
      exams++;
      L.push("BEGIN:VEVENT");
      L.push("UID:qaib-imtahan-" + exams + "-" + st.getTime() + "@qaib");
      L.push("DTSTAMP:" + stamp);
      L.push("DTSTART:" + icsStamp(st));
      L.push("DTEND:" + icsStamp(en));
      L.push(icsFold("SUMMARY:İmtahan — " + icsEsc(r.name)));
      if (r.examRoom) L.push(icsFold("LOCATION:" + icsEsc(r.examRoom)));
      L.push(icsFold("DESCRIPTION:" + icsEsc(key)));
      L.push("BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY",
             icsFold("DESCRIPTION:" + icsEsc(r.name + " imtahanına 2 gün qaldı")), "END:VALARM");
      L.push("BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY",
             icsFold("DESCRIPTION:" + icsEsc(r.name + " imtahanına 1 gün qaldı")), "END:VALARM");
      L.push("END:VEVENT");
    }
  }

  L.push("END:VCALENDAR");
  return { text: L.join("\r\n") + "\r\n", lessons, exams, skipped };
}

/* Sınaq hadisəsi: 3 dəqiqə sonra başlayır, 1 dəqiqə əvvəl xəbərdarlıq */
function testIcs(startAt) {
  const start = startAt instanceof Date ? startAt : new Date(Date.now() + 10 * 60000);

/* iOS-da ana ekran tətbiqləri fayl endirə bilmir — orada paylaşma vərəqi işləyir.
   Ona görə sıra belədir: paylaşma → platformanın endirməsi → klassik endirmə. */
const isStandalone = () =>
  (window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

const isiOS = () =>
  /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

function saveFile(name, text, mime) {
  const type = (mime || "text/plain;charset=utf-8").split(";")[0];

  // 1) iPhone/iPad: endirmə etibarsızdır — paylaşma vərəqi açılır.
  //    Jest itməsin deyə heç bir await-dən əvvəl çağırılır.
  //    Masaüstündə isə adi endirmə daha rahatdır, ona görə yalnız iOS-da.
  if (isiOS()) {
    try {
      if (navigator.share && navigator.canShare && window.File) {
        const file = new File([text], name, { type });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name }).catch(() => {});
          return true;
        }
      }
    } catch (e) { /* aşağıdaki yollara keç */ }
    // paylaşma alınmadısa, faylı yeni səhifədə aç — Safari oradan Təqvimə ötürə bilir
    try {
      const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      return true;
    } catch (e) { /* aşağı davam */ }
  }

  // 2) Klassik endirmə (masaüstü brauzerlər, Safari-nin adi rejimi)
  let ok = false;
  try {
    const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    ok = true;
  } catch (e) { ok = false; }

  // 3) Claude pəncərəsində platformanın öz endirməsi
  if (!ok && window.claude && window.claude.use) {
    window.claude.use("downloads").then((dl) => {
      if (dl && dl.save) dl.save({ filename: name, data: text }).catch(() => {});
    }).catch(() => {});
  }
  return ok;
}


/* ============================================================
   17b. Giriş kilidi — kod və Face ID
   Ayar yalnız bu cihazda saxlanılır (buluda getmir): Face ID açarı
   cihaza bağlıdır, kodu da hər cihazda ayrıca qurmaq daha təhlükəsizdir.
   ============================================================ */
const LOCK_KEY = "qaib.lock";
const LOCK_AFTER = [[0, "Dərhal"], [60, "1 dəq"], [300, "5 dəq"], [900, "15 dəq"]];
let lockCfgMem = null;
let lockLocked = false;
let lockHiddenAt = 0;
let bioAvail = null;        // null — hələ yoxlanmayıb
let pad = null;             // hazırkı klaviatura vəziyyəti

function lockCfg() {
  if (lockCfgMem) return lockCfgMem;
  try {
    const c = JSON.parse(localStorage.getItem(LOCK_KEY) || "null");
    if (c && typeof c.hash === "string" && c.hash && typeof c.salt === "string") lockCfgMem = c;
  } catch (e) { /* zədəli — kilid yoxdur */ }
  return lockCfgMem;
}
function lockSave(c) {
  lockCfgMem = c || null;
  try {
    if (c) localStorage.setItem(LOCK_KEY, JSON.stringify(c));
    else localStorage.removeItem(LOCK_KEY);
  } catch (e) {}
}
const lockOn = () => !!lockCfg();
const lockAfter = () => { const c = lockCfg(); return c && typeof c.after === "number" ? c.after : 60; };

const b64e = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const b64d = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));

async function pinHash(pin, saltB64) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pin)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64d(saltB64), iterations: 150000, hash: "SHA-256" }, key, 256);
  return b64e(bits);
}
async function pinOk(pin) {
  const c = lockCfg();
  return !!c && (await pinHash(pin, c.salt)) === c.hash;
}

function bioName() {
  const ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "Face ID";
  if (/Macintosh/.test(ua)) return "Touch ID";
  if (/Windows/.test(ua)) return "Windows Hello";
  if (/Android/.test(ua)) return "Barmaq izi";
  return "Biometrik giriş";
}
async function bioCheck() {
  try {
    bioAvail = !!(window.PublicKeyCredential && window.isSecureContext &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  } catch (e) { bioAvail = false; }
  return bioAvail;
}
async function bioEnroll() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rnd(32),
    rp: { name: "Qaib Jurnalı", id: location.hostname },
    user: { id: rnd(16), name: "Qaib Jurnalı", displayName: "Qaib Jurnalı" },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" },
    attestation: "none",
    timeout: 60000,
  } });
  return b64e(cred.rawId);
}
async function bioVerify() {
  const c = lockCfg();
  if (!c || !c.bio) return false;
  const a = await navigator.credentials.get({ publicKey: {
    challenge: rnd(32),
    rpId: location.hostname,
    allowCredentials: [{ type: "public-key", id: b64d(c.bio), transports: ["internal"] }],
    userVerification: "required",
    timeout: 60000,
  } });
  // eyni açar olmalı və istifadəçi doğrulanmalıdır (UV bayrağı)
  const flags = new Uint8Array(a.response.authenticatorData)[32];
  return b64e(a.rawId) === c.bio && !!(flags & 0x04);
}

/* ---- klaviatura ekranı ---- */

  <path d="M10 11v2.2M20 11v2.2M15 11v5.5h-1.3M11 20.2c2.3 2 5.7 2 8 0"/></svg>`;

/* opts: { title, sub, len, lenToggle, bio, cancel, forgot, onPin(pin) → Promise<true|string> } */

}
function padClose() {
  pad = null;
  const el = document.getElementById("lock");

}
function padWait() {
  const c = lockCfg();
  return c && c.until ? Math.max(0, Math.ceil((c.until - Date.now()) / 1000)) : 0;
}
function padDraw() {

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    .map((d) => `<button type="button" data-lk="d" data-d="${d}" ${wait ? "disabled" : ""}>${d}</button>`).join("");

function padShake(msg) {
  if (!pad) return;
  pad.val = "";
  pad.err = msg;
  padDraw();
  const d = document.querySelector("#lock .lock-dots");
  if (d) { d.classList.add("shake"); if (navigator.vibrate) navigator.vibrate(120); }
}
async function padDigit(d) {
  if (!pad || pad.busy || padWait() || pad.val.length >= pad.len) return;
  pad.val += d;
  pad.err = "";
  padDraw();
  if (pad.val.length < pad.len) return;
  pad.busy = true;
  const p = pad;
  let res;
  try { res = await p.onPin(p.val); } catch (e) { res = "Xəta baş verdi, yenidən yoxla"; }
  if (pad !== p) return;        // ekran artıq dəyişib
  p.busy = false;
  if (res !== true) padShake(typeof res === "string" ? res : "Kod səhvdir");
}
function padClick(e) {
  const b = e.target.closest("[data-lk]");
  if (!b || !pad) return;
  const k = b.dataset.lk;
  if (k === "d") return padDigit(b.dataset.d);
  if (k === "del") { if (!pad.busy) { pad.val = pad.val.slice(0, -1); pad.err = ""; padDraw(); } return; }
  if (k === "len") { pad.len = pad.len === 4 ? 6 : 4; pad.val = ""; pad.err = ""; return padDraw(); }
  if (k === "cancel") { const f = pad.onCancel; padClose(); if (f) f(); return; }
  if (k === "bio") return lockBio(true);
  if (k === "forgot") { pad.forgotView = true; return padDraw(); }
  if (k === "back") { pad.forgotView = false; return padDraw(); }
  if (k === "wipe") return lockWipe();
}
/* kilid ekranı açıqdırsa, klaviatura yalnız ona işləyir */
window.addEventListener("keydown", (e) => {
  if (!pad) return;
  e.stopImmediatePropagation();
  if (pad.forgotView) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); padDigit(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); if (!pad.busy) { pad.val = pad.val.slice(0, -1); padDraw(); } }
  else if (e.key === "Escape" && pad.cancel) { e.preventDefault(); const f = pad.onCancel; padClose(); if (f) f(); }
}, true);

/* ---- kilidləmə / açma ---- */
function lockFail() {
  const c = Object.assign({}, lockCfg());
  c.fails = (c.fails || 0) + 1;
  if (c.fails >= 5) c.until = Date.now() + Math.min(900, 30 * Math.pow(2, c.fails - 5)) * 1000;
  lockSave(c);
}
function lockPass() {
  const c = lockCfg();
  if (c && (c.fails || c.until)) { const n = Object.assign({}, c); delete n.fails; delete n.until; lockSave(n); }
  const was = lockLocked;
  lockLocked = false;
  const el = document.getElementById("lock");
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!was || calm || !el || el.hidden) {
    document.documentElement.classList.remove("qj-locked");

  pad = null;                                  // daha toxunuş qəbul etmə

    dots.querySelectorAll("i").forEach((i) => i.classList.add("on"));

}
function lockNow(auto) {
  if (!lockOn()) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  lockLocked = true;
  document.documentElement.classList.add("qj-locked");
  padOpen({
    title: "Kodu daxil et",
    sub: lockCfg().bio ? bioName() + " və ya kod ilə aç" : "",
    len: lockCfg().len || 4,
    bio: true,
    forgot: true,
    onPin: async (pin) => {
      if (await pinOk(pin)) { lockPass(); return true; }
      lockFail();
      return "Kod səhvdir";
    },
  });
  if (auto && lockCfg().bio) setTimeout(() => lockBio(false), 250);
}
let bioBusy = false;
async function lockBio(byTap) {
  if (bioBusy || !lockLocked || padWait()) return;
  bioBusy = true;
  try {
    if (await bioVerify()) lockPass();
    else if (byTap) padShake(bioName() + " tanımadı");
  } catch (e) {
    // avtomatik cəhdi brauzer rədd edə bilər (toxunuş tələb olunur) — düymə qalır
    if (byTap && pad && e && e.name !== "NotAllowedError" && e.name !== "AbortError") padShake(bioName() + " alınmadı");
  } finally { bioBusy = false; }
}
function lockWipe() {
  try { [LS_KEY, LS_OLD, CFG_KEY, LOCK_KEY].forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  location.replace(location.pathname);
}

document.addEventListener("visibilitychange", () => {
  if (!lockOn()) return;
  if (document.hidden) {
    lockHiddenAt = Date.now();
    // "Dərhal" — tətbiq dəyişdiricisinin şəklində məlumat görünməsin
    if (lockAfter() === 0 && !lockLocked && !pad) lockNow(false);
  } else if (lockLocked) {
    if (lockCfg().bio) setTimeout(() => lockBio(false), 300);
  } else if (!pad && lockHiddenAt && Date.now() - lockHiddenAt >= lockAfter() * 1000) {
    lockNow(true);
  }
});

function lockBoot() {
  if (lockOn()) lockNow(false);
  bioCheck().then(() => { if (current === "ayarlar" && !lockLocked) render(); });
  // açılış ekranı çəkiləndən sonra Face ID özü soruşulur
  if (lockOn() && lockCfg().bio) setTimeout(() => lockBio(false), 1800);
}

/* ---- sazlamalardan çağırılan əməliyyatlar ---- */
function lockAsk(title, onOk) {
  padOpen({
    title, sub: "", len: lockCfg().len || 4, cancel: true,
    onPin: async (pin) => {
      if (padWait()) return "Gözlə";
      if (!(await pinOk(pin))) { lockFail(); return "Kod səhvdir"; }
      lockPass();
      onOk();
      return true;
    },
  });
}
function lockSetFlow(old) {
  if (!window.crypto || !crypto.subtle) {
    return openDialog("Kilid qurmaq olmur", "", `<p class="dlg-msg">Bu səhifə təhlükəsiz bağlantı (https) ilə açılmayıb.</p>`, null, "Oldu");
  }
  padOpen({
    title: old ? "Yeni kodu daxil et" : "Kod təyin et",
    sub: "Proqramı açmaq üçün istifadə olunacaq",
    len: (old && old.len) || 4, lenToggle: true, cancel: true,
    onPin: async (first) => {
      const len = first.length;
      padOpen({
        title: "Kodu təkrar daxil et", sub: "", len, cancel: true,
        onPin: async (second) => {
          if (second !== first) {
            setTimeout(() => { lockSetFlow(old); if (pad) { pad.err = "Kodlar uyğun gəlmədi"; padDraw(); } }, 0);
            return true;
          }
          const salt = b64e(rnd(16));
          const hash = await pinHash(first, salt);
          lockSave({ v: 1, salt, hash, len, bio: old ? old.bio || null : null, after: old ? lockAfter() : 60 });
          padClose();
          render();
          if (!old && bioAvail) {
            setTimeout(() => openDialog(bioName() + " də qoşulsun?", "kod ehtiyat kimi qalır",
              `<p class="dlg-msg">Proqramı kod yığmadan, ${esc(bioName())} ilə açmaq olar.</p>`,
              () => lockBioOn(), "Qoş"), 0);
          } else toast(old ? "Kod dəyişdi" : "Kilid quruldu");
          return true;
        },
      });
      return true;
    },
  });
}
async function lockBioOn() {
  try {
    const id = await bioEnroll();
    lockSave(Object.assign({}, lockCfg(), { bio: id }));
    toast(bioName() + " qoşuldu");
  } catch (e) {
    if (!e || e.name !== "NotAllowedError") {
      openDialog(bioName() + " qoşulmadı", "", `<p class="dlg-msg">${esc(e && e.message ? e.message : "Naməlum xəta")}</p>`, null, "Oldu");
    }
  }
  render();
}


/* ============================================================
   18. Başlat
   ============================================================ */
lockBoot();
render();
initStore();

/* Oflayn is ucun: sened sorgulari sebekadan, ikonlar kesden */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* açılış ekranı — loqo yığılır, sonra proqram yumşaq açılır */
(function () {
  const sp = document.getElementById("splash");
  if (!sp) return;
  const az = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bitir = () => {
    sp.classList.add("gone");
    if (!az) {
      const w = document.querySelector(".win");
      if (w) {
        w.classList.add("reveal");
        setTimeout(() => w.classList.remove("reveal"), 700);
      }
      playEnter();
    }
    setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
  };
  setTimeout(bitir, az ? 0 : 1700);
})();

/* icmal açıqdırsa, "növbəti dərs" kartı hər dəqiqə yenilənir */
setInterval(() => {
  if (current !== "overview" || document.hidden) return;
  if (!document.getElementById("modal").hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  render();
}, 60000);

/* açılışdan sonra arxa planda yenilik yoxla */
setTimeout(() => checkUpdate(true), 1500);
setTimeout(() => { pushRefresh().then(render); }, 900);
</script>
